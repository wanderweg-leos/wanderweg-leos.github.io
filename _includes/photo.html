{% comment %}
  A photo in a frame. The frame's shape is set by where it is used (see
  "Photos" in assets/css/styles.css), and the photo is cropped to fill it.
  Usage: {% include photo.html src="/media/img/gallop.jpg" alt="…" position="50% 30%" lazy=true class="tall" %}
{% endcomment %}<figure class="frame{% if include.class %} {{ include.class }}{% endif %}"><img src="{{ include.src | relative_url }}" alt="{{ include.alt | escape }}"{% if include.lazy %} loading="lazy"{% endif %}{% if include.position %} style="object-position:{{ include.position }}"{% endif %}></figure>
