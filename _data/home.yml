# ─────────────────────────────────────────────────────────────
#  Home page text and photos
#  Change the words between the quotes. Keep the indentation.
#  Photos live in media/img/. To swap one, upload the new photo
#  there and change the file name here.
#
#  The small "Next litter" tag on the big photo comes from
#  _data/litter.yml, so it changes when the litter panel does.
# ─────────────────────────────────────────────────────────────

hero:
  # Words inside <em> … </em> appear in the accent colour.
  title: "Gentle giants, raised <em>in our home</em> for yours."
  text: "We are a small family kennel in Halifax, Nova Scotia, breeding CKC-registered Leonbergers for health, temperament, type and soundness."
  photo: gallop.jpg
  photo_alt: "Leonberger in full gallop across the lawn"
  # Which part of the photo to keep when it is cropped ("left-right top-bottom").
  photo_position: "30% 55%"
  button: "About our puppies"        # goes to the Puppies page
  second_button: "Meet our Leos"     # goes to the Our Leos page

# The three cards under the big photo
why:
  eyebrow: "Why Wanderweg"
  title: "Our dogs are family first, and every puppy is raised that way."
  # icon: shield, house or heart
  cards:
    - icon: shield
      title: "Health-tested parents"
      text: "Hips and elbows x-rayed, eyes checked, and LEMP and LPN1–3 DNA tests before any litter is planned."
    - icon: house
      title: "Raised in our home"
      text: "Puppies grow up in the house with us, handled every day and well socialized before they leave."
    - icon: heart
      title: "Matched with care"
      text: "We take time to place each puppy with a family who will include them in everything they do."

# The two photos and "Meet the girls"
meet:
  eyebrow: "Our Leos"
  title: "Meet the girls"
  text: "Riley, Priya and Fiona are family dogs first. Every one of our Leonbergers lives in the house with us. Meet each of them and see their full health results."
  button: "Our Leos →"
  # Which two dogs' photos to show (their ids in _data/leos.yml)
  dogs: [riley, fiona]

# The dark band at the bottom of the page
cta:
  title: "Thinking about a Leo?"
  text: "Start with our honest look at life with a Leonberger, then apply for a puppy."
  fit_button: "Is a Leo right for you?"   # goes to that section of the About page
  apply_button: "Apply for a puppy"
