# ─────────────────────────────────────────────────────────────
#  Home page text and photos
#  Change the words between the quotes. Keep the indentation.
#  Photos live in media/img/. To swap one, upload the new photo
#  there and change the file name here.
#
#  The dog cards in "Meet the girls" come from _data/leos.yml and
#  the "Life with Leos" photos from _data/gallery.yml.
# ─────────────────────────────────────────────────────────────

hero:
  # Words inside <em> … </em> appear in the accent colour.
  title: "Gentle giants, raised <em>in our home</em> for yours."
  text: "We are a small family kennel in Halifax, Nova Scotia, breeding CKC-registered Leonbergers for health, temperament, type and soundness."
  photo: gallop.jpg
  photo_alt: "Leonberger in full gallop across the lawn"
  # Which part of the photo to keep when it is cropped ("left-right top-bottom").
  photo_position: "30% 55%"
  button: "About our puppies"        # goes to the Litters page
  second_button: "Meet our Leos"     # goes to the Our Leos page
  # The three short facts under the buttons
  stats:
    - big: "20+ years"
      small: "raising Leonbergers"
    - big: "Health-tested"
      small: "hips, elbows, eyes, DNA"
    - big: "CKC"
      small: "registered puppies"

# The three numbered boxes
why:
  eyebrow: "Why Wanderweg"
  title: "More than twenty years of Leonbergers, one litter at a time."
  cards:
    - title: "Health comes first"
      text: "Every parent has hips and elbows X-rayed, eyes examined and DNA tests for LEMP and LPN1–3 before we plan a litter. The results are on each dog’s page."
    - title: "Lines we know well"
      text: "Our first litter was born in 2002. Every one of our girls comes from a mother we raised ourselves, so we know the temperament and health behind each puppy."
    - title: "Ready for home"
      text: "Every puppy goes home vet checked, vaccinated, microchipped and CKC registered, with a written contract."

# About us. The memberships line under it comes from _config.yml.
about:
  eyebrow: "About us"
  title: "Our dogs are family first"
  lede: "We’ve been raising Leonbergers in Halifax, Nova Scotia, for over 20 years."
  paragraphs:
    - "Our Leonbergers are the loves of our lives. Puppies are raised in our home, handled every day and well socialized before they leave. We take time to match each puppy with a family who will include them in everything they do."
    - "We breed for health, temperament, type and soundness. Every breeding dog is fully health tested before a litter is planned, and every puppy is health checked before going home."
  photo: four-leos.jpg
  photo_alt: "Four Leonbergers sitting side by side on the grass"

# "Meet the girls". The cards show every dog in _data/leos.yml.
meet:
  eyebrow: "Our Leos"
  title: "Meet the girls"
  text: "Ava, Marley, Lottie and Hazel are family dogs first. Every one of our Leonbergers lives in the house with us."
  link: "Pedigrees & health results →"

# The dark band with the beach photo
outdoors:
  eyebrow: "Out and about"
  title: "Made for the long way round."
  paragraphs:
    - "Leos are happiest outdoors with their people: a swim in the lake, a trot along the beach, a romp through deep snow in a Canadian winter."
    - "Our puppies grow up underfoot, meeting family life, new sounds, new surfaces and new friends, so they head home confident and ready for adventures of their own."
  photo: gallery/beach-trot.jpg
  photo_alt: "Leonberger trotting along the beach by the ocean"

# The photo grid (photos listed in _data/gallery.yml)
photos:
  eyebrow: "Photos"
  title: "Life with Leos"

# The dark band at the bottom of the page
cta:
  title: "Thinking about a Leo?"
  text: "Start with our honest look at life with a Leonberger, then apply for a puppy."
  fit_button: "Is a Leo right for you?"   # goes to that section of The Breed page
  apply_button: "Apply for a puppy"
