# ─────────────────────────────────────────────────────────────
#  Puppy questionnaire
#
#  The form on the website is built from this file, and the
#  emails you receive list the answers in the same order, so you
#  can add, remove, reword or reorder questions here without
#  touching any code.
#
#  Each question has:
#    id:        a unique short name with no spaces (e.g. own_rent).
#               Don't use the same id twice.
#    label:     the question as people see it, and as it appears
#               in the emails you receive.
#    type:      one of
#                 text      one line of text
#                 textarea  a bigger box for longer answers
#                 email     an email address
#                 tel       a phone number
#                 select    a drop-down list (needs options)
#                 radio     pick one (needs options)
#                 checkbox  pick any number (needs options)
#                 name      first + last name boxes (use once)
#                 address   full address boxes (use once)
#    required:  true if it must be answered
#    options:   the choices, for select / radio / checkbox
#    other:     true adds an "Other" choice with a text box
#    half:      true makes the question half width on computers,
#               so two "half" questions sit side by side
#    columns:   true lays a long list of choices out in columns
#    show_if:   optional. Makes this a follow-up question that only
#               appears after a certain answer to an earlier
#               question. Put the earlier question's id here...
#    show_when: ...and the answer(s) that make it appear, e.g.
#                 show_if: rehomed
#                 show_when: ["Yes"]
#               The answers must match that question's options
#               exactly. A hidden question is never required and is
#               left out of the email.
#
#  Important: keep the "email" question with id "email" and the
#  "name" question. The email subject and "Reply" use them.
# ─────────────────────────────────────────────────────────────

# Top of the questionnaire page
eyebrow: "Puppy questionnaire"
title: "Tell us about your family"
submit_button: "Submit questionnaire"

# Shown just above the submit button. Keep it true to how you handle answers.
privacy: "We use your answers only to get to know you and to match our puppies with the right families. We never sell or share them. Email us any time if you’d like us to delete yours."

intro:
  - "Thank you for your interest in a Wanderweg Leonberger puppy. To make sure one of our puppies suits your lifestyle, please take some time to answer these questions about your family and what you are looking for in your new puppy."
  - "We read every questionnaire and will be in touch by email. Please ask us as many questions as you like in return."

# The thank-you page people see after they submit
# (wanderweg.ca/questionnaire/thank-you/).
thank_you:
  eyebrow: "Questionnaire sent"
  title: "Thank you!"
  paragraphs:
    - "Your questionnaire is on its way to us. We read every one ourselves and will be in touch by email."
  photo: puppy-lifejacket.jpg
  photo_alt: "Puppy in an orange life jacket wading in the lake"
  next_title: "While you wait"
  next:
    - "Have a question in the meantime? Just email us. You can also follow along with our Leos on Instagram and Facebook."

sections:

  - title: "About you"
    questions:
      - type: name
        label: "Name"
        required: true
      - id: phone
        type: tel
        label: "Phone"
        required: true
        half: true
      - id: email
        type: email
        label: "Email"
        required: true
        half: true
      - type: address
        label: "Address"
        required: true
      - id: relationship
        type: radio
        label: "Relationship status"
        required: true
        options: ["Married", "Long term relationship", "Single"]
      - id: occupation
        type: text
        label: "Occupation"
        required: true
      - id: partner_occupation
        type: text
        label: "Partner’s occupation"
        required: true
        show_if: relationship
        show_when: ["Married", "Long term relationship"]
      - id: children
        type: radio
        label: "Do you have any children?"
        required: true
        options: ["Yes", "No"]
      - id: children_details
        type: textarea
        label: "Please tell us about your children, including their ages."
        required: true
        show_if: children
        show_when: ["Yes"]

  - title: "Costs"
    questions:
      - id: monthly_costs
        type: radio
        label: "Are you prepared for the financial costs involved with dog ownership, which typically will be between $200 and $300 monthly?"
        required: true
        options: ["Yes", "No"]
      - id: vet_bills
        type: radio
        label: "Do you have the means to pay for any unexpected vet bills?"
        required: true
        options: ["Yes", "No", "Maybe"]
      - id: pet_insurance
        type: radio
        label: "Are you planning on getting pet insurance?"
        required: true
        options: ["Yes", "No", "Maybe"]

  - title: "Your home"
    questions:
      - id: own_rent
        type: radio
        label: "Do you own or rent your home?"
        required: true
        options: ["Own", "Rent"]
      - id: fenced_yard
        type: radio
        label: "Do you have a kennel, dog run or fenced yard?"
        required: true
        options: ["Yes", "No"]
      - id: yard_description
        type: textarea
        label: "Please describe your kennel, dog run or fenced yard."
        required: true
        show_if: fenced_yard
        show_when: ["Yes"]
      - id: plan_to_build
        type: radio
        label: "Do you plan on building a kennel, dog run or fenced yard?"
        required: true
        options: ["Yes", "No", "Maybe"]
        show_if: fenced_yard
        show_when: ["No"]
      - id: home_description
        type: textarea
        label: "Please describe your home and property."
        required: true
      - id: other_dogs
        type: radio
        label: "Are there any other dogs in your home?"
        required: true
        options: ["Yes", "No"]
      - id: other_dogs_details
        type: textarea
        label: "Please describe your other dogs."
        required: true
        show_if: other_dogs
        show_when: ["Yes"]

  - title: "Why a Leonberger"
    questions:
      - id: interest
        type: checkbox
        label: "Why are you interested in obtaining a Leonberger puppy? Select all that apply."
        required: true
        columns: true
        other: true
        options: ["Companion", "Obedience", "Agility", "Conformation", "Therapy work", "Tracking", "Breeding", "Drafting"]
      - id: gender
        type: radio
        label: "Do you have any preference in the gender?"
        required: true
        options: ["Male", "Female", "No preference"]
      - id: opposite_gender
        type: textarea
        label: "Would you accept a puppy of the opposite gender? Briefly explain."
        required: true
        show_if: gender
        show_when: ["Male", "Female"]
      - id: research
        type: textarea
        label: "Have you researched Leonbergers, and why do you think this is the breed of dog that is best suited for your family? Please explain."
        required: true

  - title: "Daily life with your puppy"
    questions:
      - id: daily_time
        type: select
        label: "What amount of time will you spend daily with your new puppy?"
        required: true
        half: true
        options: ["Less than 2 hours", "2 to 4 hours", "4 to 8 hours", "Most of the day"]
      - id: activity_level
        type: select
        label: "What activity level would you consider yourself and your family?"
        required: true
        half: true
        options: ["Relaxed", "Moderately active", "Very active"]
      - id: work_plan
        type: textarea
        label: "If you work full time, how will you provide for your young puppy during the day?"
        required: true
      - id: training_plan
        type: textarea
        label: "Describe your plans for training your Leonberger puppy."
        required: true
      - id: obedience_classes
        type: radio
        label: "Will you attend obedience classes with your dog?"
        required: true
        options: ["Yes", "No", "Maybe"]
      - id: car
        type: radio
        label: "Will you be taking your dog in the car with you?"
        required: true
        options: ["Yes", "No"]
      - id: travel
        type: radio
        label: "Are you willing to travel to pick up your new puppy?"
        required: true
        options: ["Yes", "No"]

  - title: "Pet history"
    questions:
      - id: rehomed
        type: radio
        label: "Have you ever had to rehome a pet?"
        required: true
        options: ["Yes", "No"]
      - id: rehomed_details
        type: textarea
        label: "Please briefly describe the circumstances of rehoming your pet."
        required: true
        show_if: rehomed
        show_when: ["Yes"]
      - id: euthanized
        type: radio
        label: "Have you ever had to euthanize (put to sleep) a pet?"
        required: true
        options: ["Yes", "No"]
      - id: euthanized_details
        type: textarea
        label: "Please briefly describe the circumstances of euthanizing your pet."
        required: true
        show_if: euthanized
        show_when: ["Yes"]
      - id: spay_neuter
        type: radio
        label: "Are you planning to spay or neuter your dog at the appropriate age?"
        required: true
        options: ["Yes", "No"]
      - id: bred_before
        type: radio
        label: "Have you ever bred a litter of puppies?"
        required: true
        options: ["Yes", "No"]
      - id: litters_description
        type: textarea
        label: "Please describe the litter(s)."
        required: true
        show_if: bred_before
        show_when: ["Yes"]
      - id: want_to_breed
        type: radio
        label: "Would you like to breed your dog?"
        required: true
        options: ["Yes", "No"]
      - id: breeding_plans
        type: textarea
        label: "Please explain your breeding plans."
        required: true
        show_if: want_to_breed
        show_when: ["Yes"]

  - title: "Final questions"
    questions:
      - id: vet_reference
        type: radio
        label: "May we call your veterinarian for a reference?"
        required: true
        options: ["Yes", "No"]
      - id: vet_name
        type: text
        label: "Veterinarian’s name"
        required: true
        half: true
        show_if: vet_reference
        show_when: ["Yes"]
      - id: vet_phone
        type: tel
        label: "Veterinarian’s phone number"
        required: true
        half: true
        show_if: vet_reference
        show_when: ["Yes"]
      - id: wait
        type: radio
        label: "Are you willing to wait for a Wanderweg Leo puppy?"
        required: true
        other: true
        options: ["No", "3 months", "6 months", "1 year"]
      - id: contract
        type: radio
        label: "Are you willing to abide by a sales contract that includes such things as registration, health, breeding, and general care requirements?"
        required: true
        options: ["Yes", "No"]
      - id: further_info
        type: textarea
        label: "Please give us any further information you wish us to consider in placing one of our Leonberger puppies with you and your family."
