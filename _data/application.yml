# ─────────────────────────────────────────────────────────────
#  Apply for a puppy (wanderweg.ca/apply/)
#
#  The form on the website is built from this file, and the
#  emails you receive list the answers in the same order, so you
#  can add, remove, reword or reorder questions here without
#  touching any code.
#
#  Each question has:
#    id:        a unique short name with no spaces (e.g. own_rent).
#               Don't use the same id twice.
#    label:     the question as people see it, and as it appears
#               in the emails you receive.
#    type:      one of
#                 text      one line of text
#                 textarea  a bigger box for longer answers
#                 email     an email address
#                 tel       a phone number
#                 select    a drop-down list (needs options)
#                 radio     pick one (needs options)
#                 checkbox  pick any number (needs options)
#                 name      first + last name boxes (use once)
#                 address   full address boxes (use once)
#    required:  true if it must be answered. Questions without it
#               are marked "(optional)" on the form.
#    options:   the choices, for select / radio / checkbox
#    other:     true adds an "Other" choice with a text box
#    half:      true makes the question half width on computers,
#               so two "half" questions sit side by side
#    columns:   true lays a long list of choices out in columns
#    show_if:   optional. Makes this a follow-up question that only
#               appears after a certain answer to an earlier
#               question. Put the earlier question's id here...
#    show_when: ...and the answer(s) that make it appear, e.g.
#                 show_if: rehomed
#                 show_when: ["Yes"]
#               The answers must match that question's options
#               exactly. A hidden question is never required and is
#               left out of the email.
#
#  The form is shown one part (section) at a time, then a review
#  screen. Each part is checked before moving on, and answers are
#  saved in the visitor's browser so they can finish later.
#
#  Important: keep the "email" question with id "email" and the
#  "name" question. The email subject and "Reply" use them.
# ─────────────────────────────────────────────────────────────

# Top of the Apply page
eyebrow: "Apply"
title: "Apply for a puppy"
intro:
  - "Thank you for your interest in a Wanderweg Leonberger puppy. To make sure one of our puppies suits your lifestyle, our application asks about your family, your home and what you are looking for in a puppy. It is in four short parts, and you can review your answers before you submit."
  - "We read every application ourselves and will be in touch by email. Please ask us as many questions as you like in return."

# The contact box beside the form
talk_title: "Prefer to talk first?"
talk_text: "Interested in a puppy, or just want to talk Leos? We’d love to hear from you. Email is the best way to reach us."

# Buttons and small wording around the form
next_button: "Next"
back_button: "Back"
review_button: "Review answers"
submit_button: "Submit application"
review_title: "Review your application"
review_text: "Please check your answers. You can edit any part before you submit."
edit_button: "Edit"
saved_note: "Your answers are saved in this browser as you go, so you can come back and finish later."
clear_button: "Clear my answers"

# Shown on the review screen, above the submit button. Keep it true to how you handle answers.
privacy: "We use your answers only to get to know you and to match our puppies with the right families. We never sell or share them. Email us any time if you’d like us to delete yours."

# The thank-you page people see after they submit
# (wanderweg.ca/apply/thank-you/).
thank_you:
  eyebrow: "Application sent"
  title: "Application received"
  paragraphs:
    - "Thank you for applying for a Wanderweg puppy. We read every application ourselves and will be in touch by email."
  photo: puppy-lifejacket.jpg
  photo_alt: "Puppy in an orange life jacket wading in the lake"
  next_title: "While you wait"
  next:
    - "Have a question in the meantime? Just email us. You can also follow along with our Leos on Instagram and Facebook."
  button: "Meet our Leos"

sections:

  - title: "About you"
    questions:
      - type: name
        label: "Name"
        required: true
      - id: phone
        type: tel
        label: "Phone"
        required: true
        half: true
      - id: email
        type: email
        label: "Email"
        required: true
        half: true
      - type: address
        label: "Address"
        required: true
      - id: household
        type: textarea
        label: "Who lives in your home? Please include the adults and the ages of any children."
        required: true
      - id: litter
        type: radio
        label: "Which litter are you interested in?"
        required: true
        options: ["Spring 2027", "A future litter", "Not sure yet"]
      - id: timing
        type: text
        label: "When would you ideally like to bring a puppy home?"
      - id: gender
        type: radio
        label: "Do you have any preference in the gender?"
        required: true
        options: ["Male", "Female", "No preference"]
      - id: opposite_gender
        type: textarea
        label: "Would you accept a puppy of the opposite gender? Briefly explain."
        show_if: gender
        show_when: ["Male", "Female"]
      - id: how_heard
        type: text
        label: "How did you hear about us?"

  - title: "Your home"
    questions:
      - id: own_rent
        type: radio
        label: "Do you own or rent your home?"
        required: true
        options: ["Own", "Rent"]
      - id: fenced_yard
        type: radio
        label: "Do you have a kennel, dog run or fenced yard?"
        required: true
        options: ["Yes", "No"]
      - id: yard_description
        type: textarea
        label: "Please describe your kennel, dog run or fenced yard."
        show_if: fenced_yard
        show_when: ["Yes"]
      - id: plan_to_build
        type: radio
        label: "Do you plan on building a kennel, dog run or fenced yard?"
        required: true
        options: ["Yes", "No", "Maybe"]
        show_if: fenced_yard
        show_when: ["No"]
      - id: home_description
        type: textarea
        label: "Please describe your home and property."
        required: true
      - id: sleep_alone
        type: textarea
        label: "Where will your puppy sleep, and where will they stay when no one is home?"
        required: true
      - id: other_dogs
        type: radio
        label: "Are there any other dogs in your home?"
        required: true
        options: ["Yes", "No"]
      - id: other_dogs_details
        type: textarea
        label: "Please describe your other dogs."
        show_if: other_dogs
        show_when: ["Yes"]

  - title: "Life with your puppy"
    questions:
      - id: weekday
        type: textarea
        label: "What does a typical weekday look like for your household, and how many hours would your puppy be alone?"
        required: true
      - id: daily_time
        type: select
        label: "How much time will you spend each day with your new puppy?"
        required: true
        half: true
        options: ["Less than 2 hours", "2 to 4 hours", "4 to 8 hours", "Most of the day"]
      - id: activity_level
        type: select
        label: "How active would you say you and your family are?"
        required: true
        half: true
        options: ["Relaxed", "Moderately active", "Very active"]
      - id: training_plan
        type: textarea
        label: "Describe your plans for training your Leonberger puppy."
        required: true
      - id: obedience_classes
        type: radio
        label: "Will you attend obedience classes with your dog?"
        required: true
        options: ["Yes", "No", "Maybe"]
      - id: car
        type: radio
        label: "Will you be taking your dog in the car with you?"
        required: true
        options: ["Yes", "No"]
      - id: travel
        type: radio
        label: "Are you willing to travel to pick up your new puppy?"
        required: true
        options: ["Yes", "No"]
      - id: holidays
        type: textarea
        label: "What will you do with your dog when you go on holiday or travel without them?"
        required: true
      - id: costs_ack
        type: checkbox
        label: "The cost of owning a Leonberger"
        required: true
        options: ["I understand that owning a Leonberger typically costs between $200 and $300 a month, plus any unexpected vet bills."]
      - id: vet_bills
        type: radio
        label: "Do you have the means to pay for any unexpected vet bills?"
        required: true
        options: ["Yes", "No", "Maybe"]
      - id: pet_insurance
        type: radio
        label: "Are you planning on getting pet insurance?"
        required: true
        options: ["Yes", "No", "Maybe"]

  - title: "Experience and final questions"
    questions:
      - id: giant_experience
        type: textarea
        label: "Do you have experience with large or giant breeds? Please tell us about it."
        required: true
      - id: past_pets
        type: textarea
        label: "Tell us about dogs or other pets you’ve had in the past, and what happened to them."
        required: true
      - id: interest
        type: checkbox
        label: "Why are you interested in a Leonberger puppy? Select all that apply."
        required: true
        columns: true
        other: true
        options: ["Companion", "Obedience", "Agility", "Conformation", "Therapy work", "Tracking", "Drafting"]
      - id: research
        type: textarea
        label: "Have you researched Leonbergers, and why do you think this is the breed best suited to your family?"
        required: true
      - id: breeding_intent
        type: radio
        label: "Do you plan to spay or neuter your dog, or would you like to breed?"
        required: true
        options: ["Spay or neuter at the appropriate age", "I would like to breed", "Not sure yet"]
      - id: breeding_plans
        type: textarea
        label: "Please explain your breeding plans, including any litters you have bred before."
        required: true
        show_if: breeding_intent
        show_when: ["I would like to breed"]
      - id: wait
        type: radio
        label: "Are you willing to wait for a Wanderweg Leo puppy?"
        required: true
        other: true
        options: ["No", "3 months", "6 months", "1 year"]
      - id: vet_reference
        type: radio
        label: "May we call your veterinarian for a reference?"
        required: true
        options: ["Yes", "No", "I don’t have a vet yet"]
      - id: vet_name
        type: text
        label: "Veterinarian’s name"
        required: true
        half: true
        show_if: vet_reference
        show_when: ["Yes"]
      - id: vet_phone
        type: tel
        label: "Veterinarian’s phone number"
        required: true
        half: true
        show_if: vet_reference
        show_when: ["Yes"]
      - id: contract
        type: radio
        label: "Are you willing to abide by a sales contract that includes such things as registration, health, breeding and general care requirements?"
        required: true
        options: ["Yes", "No"]
      - id: further_info
        type: textarea
        label: "Is there anything else you’d like us to consider in placing a puppy with your family?"
