eyebrow: "About us"
title: "Our dogs are family first"
lede: "We’ve been raising Leonbergers in Halifax, Nova Scotia, for over 15 years."
paragraphs:
  - "Our Leonbergers are the loves of our lives. Puppies are raised in our home, handled every day and well socialized before they leave. We take time to match each puppy with a family who will include them in everything they do."
  - "We breed for health, temperament, type and soundness. Every breeding dog is fully health tested before a litter is planned, and every puppy is health checked before going home."
photo: four-leos.jpg
photo_alt: "Four Leonbergers sitting side by side on the grass"

# The dark panel. The last line (memberships) is added automatically.
commitments:
  eyebrow: "Health & memberships"
