# ─────────────────────────────────────────────────────────────
#  Photo gallery ("Life with Leos")
#
#  To ADD a photo:   upload it to assets/img/gallery/, then add a
#                    new "- file:" entry below.
#  To REMOVE one:    delete its three lines below.
#  To REORDER:       move the entries up or down.
#
#  file:      the photo's file name in assets/img/gallery/
#  alt:       a short description (read aloud to blind visitors
#             and shown if the photo can't load)
#  position:  optional. Which part of the photo to keep when it is
#             cropped, as "left-right top-bottom". "50% 30%" keeps
#             the upper middle, which is handy for close-ups of faces.
#
#  Tip: the grid looks tidiest with a multiple of 3 photos (12, 15…).
#  Photos about 1400 pixels wide load quickly and look sharp.
# ─────────────────────────────────────────────────────────────

