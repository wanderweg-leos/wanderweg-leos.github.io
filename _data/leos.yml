# ─────────────────────────────────────────────────────────────
#  Our Leos: the Our Leos page (wanderweg.ca/our-leos/) and each
#  dog's own page (e.g. wanderweg.ca/our-leos/riley/). Both show
#  the row of dog cards at the top, with one dog's details below.
#  The Our Leos page shows the first dog in the list.
#
#  Each dog has:
#    id:          short name with no spaces, used in the page
#                 address. Must match the dog's file in our-leos/.
#    name, registered_name
#    photo, photo_alt:  the main photo (in media/img/leos/)
#    story:       the description, one line per paragraph.
#    clearances:  health results, shown as a table. Each has
#                   test:    e.g. "Hips"
#                   by:      the smaller line under it, e.g. "OFA"
#                   result:  e.g. "Excellent"
#    pedigree:    the parents and grandparents, shown as a family
#                 tree under the description. It has a sire (father)
#                 and a dam (mother), and each of them has their own
#                 sire and dam (the grandparents). Each dog in it has
#                   name:       registered name
#                   call_name:  optional, e.g. "Simba"
#                   born:       e.g. "Born 2013 in France"
#                 Leave pedigree out to hide the family tree.
#    photos:      optional. Extra photos for the dog's own page,
#                 each with a file (in media/img/leos/) and alt.
#
#  To ADD a dog:
#    1. Upload a photo to media/img/leos/ (about 1200 pixels
#       wide, no spaces in the file name).
#    2. Copy one of the dogs below and change the details,
#       including a new id.
#    3. In the our-leos/ folder, copy riley.html, name the copy
#       after the new id (e.g. luna.html) and change the three
#       lines inside it (see the notes in that file).
#  To REMOVE a dog: delete its lines here and delete its file
#  in our-leos/.
#
#  The cards sit three across on computers, so 3 or 6 dogs look
#  tidiest.
# ─────────────────────────────────────────────────────────────

eyebrow: "Our Leos"
title: "Meet the girls"
intro: "Every one of our Leonbergers lives in the house with us as part of the family. Choose a dog to read about her and see her health clearances."

# Wording on the dog pages. {name} is replaced with the dog's name.
clearances_title: "Health clearances"
test_heading: "Test"
result_heading: "Result"
clearances_note: "Every breeding dog is fully health tested before a litter is planned."
pedigree_title: "Pedigree"
sire_label: "Sire"
dam_label: "Dam"
grandsire_label: "Grandsire"
granddam_label: "Granddam"
# The small line under the family tree, and where it links to.
# Leave pedigree_link empty ("") to show the line without a link.
pedigree_note: "Parents and grandparents as listed on the Leonberger Database"
pedigree_link: "https://www.leonberger-database.com/search_e.php"
photos_title: "More photos of {name}"

