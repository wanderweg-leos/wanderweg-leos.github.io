# ─────────────────────────────────────────────────────────────
#  "Our Leos" section of the home page: one card per dog.
#
#  text: a short description shown on the card (a sentence or
#        two works best, so the cards stay a similar height).
#
#  To add a dog: upload a photo to assets/img/leos/ (about 1200
#  pixels wide, no spaces in the file name), then copy one of the
#  dogs below and change the details. To remove a dog, delete
#  its lines. Dogs appear in the order listed here; the cards sit
#  three across on computers, so 3 or 6 dogs look tidiest.
#  To hide the whole section, delete every dog (keep "dogs:")
#  and remove "Our Leos" from _data/navigation.yml.
# ─────────────────────────────────────────────────────────────

eyebrow: "Our Leos"
title: "Meet the girls"
intro: "Every one of our Leonbergers lives in the house with us as part of the family."

dogs:
  - name: "Riley"
    registered_name: "Wanderweg's Sugar and Spice"
    photo: riley.jpg
    photo_alt: "Riley standing on a log at the edge of the lake"
    text: "Riley is a truly delightful Leonberger. She is so beautiful and sweet with lovely structure and movement. Riley is a very fun and happy dog, always ready to go out for an adventure."
    clearances:
      - "OFA Excellent hips"
      - "Normal elbows"
      - "Eyes normal"
      - "Clear of LEMP"
      - "Clear of LPN1, LPN2 and LPN3"

  - name: "Priya"
    registered_name: "Wanderweg's Under the Moonlit Sky"
    photo: priya.jpg
    photo_alt: "Priya standing on the lawn by the lake"
    text: "Priya is a picture-perfect female Leonberger with the most amazing conformation, bone, head and coat. She is truly a special beautiful girl, and combined with her sweet and soft temperament, she is quite a special Leo."
    clearances:
      - "OFA Good hips"
      - "Normal elbows"
      - "Eyes normal"
      - "Clear of LEMP"
      - "Clear of LPN1, LPN2 and LPN3"

  - name: "Fiona"
    registered_name: "Wanderweg's the Rhythm of Life"
    photo: fiona.jpg
    photo_alt: "Fiona standing on the rocks in the woods"
    text: "Fiona is an amazing female Leonberger who is always ready to have some fun. She is a very social and friendly Leo, who loves everyone. Fiona has a great deal of zest and excels in obedience with her great attitude for life."
    clearances:
      - "OFA Excellent hips"
      - "Normal elbows"
      - "Eyes normal"
      - "Clear of LEMP"
      - "Clear of LPN1, LPN2 and LPN3"
