# ─────────────────────────────────────────────────────────────
#  "Our Leos" section of the home page: one card per dog.
#
#  On each card, the FIRST paragraph is always shown. Any further
#  paragraphs are tucked under a "More about <name>" link that
#  opens in place, so keep the first one short (a sentence or two).
#
#  To add a dog: upload a photo to assets/img/leos/ (about 1200
#  pixels wide, no spaces in the file name), then copy one of the
#  dogs below and change the details. To remove a dog, delete
#  its lines. Dogs appear in the order listed here; the cards sit
#  three across on computers, so 3 or 6 dogs look tidiest.
#  To hide the whole section, delete every dog (keep "dogs:")
#  and remove "Our Leos" from _data/navigation.yml.
# ─────────────────────────────────────────────────────────────

eyebrow: "Our Leos"
title: "Meet the girls"
intro: "Every one of our Leonbergers lives in the house with us as part of the family."

dogs:
  - name: "Riley"
    registered_name: "Wanderweg's Sugar and Spice"
    photo: riley.jpg
    photo_alt: "Riley standing on a log at the edge of the lake"
    paragraphs:
      - "Riley is a truly delightful Leonberger. She is so beautiful and sweet with lovely structure and movement. Riley is a very fun and happy dog, always ready to go out for an adventure."
      - "Riley has matured into a true beauty and is an incredible looking Leonberger with her long dark coat and beautiful full black mask. She also has the sweetest softest expression and loves to say hi to all."
    clearances:
      - "OFA Excellent hips"
      - "Normal elbows"
      - "Eyes normal"
      - "Clear of LEMP"
      - "Clear of LPN1, LPN2 and LPN3"

  - name: "Priya"
    registered_name: "Wanderweg's Under the Moonlit Sky"
    photo: priya.jpg
    photo_alt: "Priya standing on the lawn by the lake"
    paragraphs:
      - "Priya is a picture-perfect female Leonberger with the most amazing conformation, bone, head and coat. She is truly a special beautiful girl, and combined with her sweet and soft temperament, she is quite a special Leo."
      - "Priya is very sweet with a laid-back temperament; she likes to just chill with the family and is great at giving lots of kisses. We are very excited about Priya’s future puppies."
    clearances:
      - "OFA Good hips"
      - "Normal elbows"
      - "Eyes normal"
      - "Clear of LEMP"
      - "Clear of LPN1, LPN2 and LPN3"

  - name: "Fiona"
    registered_name: "Wanderweg's the Rhythm of Life"
    photo: fiona.jpg
    photo_alt: "Fiona standing on the rocks in the woods"
    paragraphs:
      - "Fiona is an amazing female Leonberger who is always ready to have some fun. She is a very social and friendly Leo, who loves everyone. Fiona has a great deal of zest and excels in obedience with her great attitude for life."
      - "Fiona is truly an amazing Leonberger with her perfect looks and fun lively temperament. She has the sweetest face you can ever imagine! We are very excited about Fiona’s future puppies."
    clearances:
      - "OFA Excellent hips"
      - "Normal elbows"
      - "Eyes normal"
      - "Clear of LEMP"
      - "Clear of LPN1, LPN2 and LPN3"
