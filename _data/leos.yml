    name: "Riley"
    registered_name: "Wanderweg’s Sugar and Spice"
    photo: riley.jpg
    photo_alt: "Riley standing on a log at the edge of the lake"
    story:
      - "Riley is a truly delightful Leonberger. She is so beautiful and sweet with lovely structure and movement. Riley is a very fun and happy dog, always ready to go out for an adventure."
      - "Riley has matured into a true beauty and is an incredible looking Leonberger with her long dark coat and beautiful full black mask. She also has the sweetest, softest expression and loves to say hi to all."
    lives: "In the house, with us"
    loves: "Adventures outdoors"
    clearances:
      - test: "Hips"
        by: "OFA"
        result: "Excellent"
      - test: "Elbows"
